  <text x="150" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#aaaaaa" text-anchor="middle" letter-spacing="1.5">WTR-LAB</text>
  <text x="150" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#666677" text-anchor="middle">LIGHT NOVEL</text>
